<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Page Not Found</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#ff9a9e,#fad0c4);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.container{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    width:400px;
}

h1{
    font-size:60px;
    margin:0;
    color:#ff4d4d;
}

p{
    font-size:18px;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:#ff4d4d;
    color:white;
    text-decoration:none;
    border-radius:20px;
}

a:hover{
    background:#e63939;
}
</style>

</head>

<body>

<div class="container">

<h1>404</h1>

<p>Oops! The page you are looking for does not exist.</p>

<a href="index.html">Go Back Home</a>

</div>

</body>
</html>
